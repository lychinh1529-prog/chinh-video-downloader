<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinh TikTok Downloader</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 26px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
    }

    h1 { text-align: center; }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 14px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 15px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #fe2c55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }

    #result {
      margin-top: 18px;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    #result img {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }

    #result a {
      display: inline-block;
      margin: 10px 10px 0 0;
      color: #7dd3fc;
    }

    .hint {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      margin-top: 20px;
    }

    footer {
      margin-top: 24px;
      color: #94a3b8;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Chinh TikTok Downloader</h1>

    <p class="subtitle">
      Công cụ lấy thông tin video TikTok
    </p>

    <textarea
      id="videoUrl"
      placeholder="Dán liên kết video TikTok vào đây..."
    ></textarea>

    <button id="checkButton" onclick="analyzeLink()">
      Phân tích video
    </button>

    <div id="result" aria-live="polite"></div>

    <p class="hint">
      Dành cho video TikTok công khai.
      Khả năng xử lý phụ thuộc vào máy chủ API.
    </p>

    <footer>
      Chinh TikTok Downloader · Miễn phí
    </footer>
  </main>

  <script>
    const API_BASE = "https://chinh-video-api.onrender.com";

    function isTikTokUrl(value) {
      try {
        const url = new URL(value);
        const host = url.hostname.toLowerCase();

        return (
          (host === "tiktok.com" || host.endsWith(".tiktok.com")) &&
          (url.protocol === "https:" || url.protocol === "http:")
        );
      } catch {
        return false;
      }
    }

    async function analyzeLink() {
      const input = document.getElementById("videoUrl");
      const result = document.getElementById("result");
      const button = document.getElementById("checkButton");
      const link = input.value.trim();

      result.replaceChildren();

      if (!link) {
        result.textContent = "Bạn hãy dán link TikTok trước nhé!";
        return;
      }

      if (!isTikTokUrl(link)) {
        result.textContent =
          "Link chưa hợp lệ. Hãy dán đường dẫn TikTok.";
        return;
      }

      button.disabled = true;
      result.textContent =
        "Đang kết nối API... Máy chủ miễn phí có thể cần thời gian khởi động.";

      try {
        const endpoint =
          API_BASE + "/api/download?url=" + encodeURIComponent(link);
