<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinh Video Downloader</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  padding: 16px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #090d16;
  color: #f1f5f9;
}
.container {
  max-width: 480px;
  margin: 10px auto;
}
header {
  text-align: center;
  margin-bottom: 20px;
}
h1 {
  font-size: 26px;
  font-weight: 800;
  margin: 0 0 4px 0;
  background: linear-gradient(135deg, #38bdf8, #818cf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle {
  color: #94a3b8;
  font-size: 13px;
  margin: 0;
}
.card {
  background: #131c2e;
  padding: 18px;
  border-radius: 20px;
  border: 1px solid #1e293b;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  margin-bottom: 20px;
}
.input-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 12px;
  color: #94a3b8;
}
.btn-clear {
  background: none;
  border: none;
  color: #f87171;
  font-size: 12px;
  cursor: pointer;
  padding: 0;
  font-weight: 600;
}
.input-group {
  position: relative;
}
textarea {
  width: 100%;
  height: 105px;
  border-radius: 14px;
  padding: 12px;
  padding-right: 65px;
  border: 1px solid #334155;
  background: #090d16;
  color: white;
  font-size: 14px;
  resize: none;
  outline: none;
  transition: border-color 0.2s;
}
textarea:focus {
  border-color: #38bdf8;
}
.btn-paste {
  position: absolute;
  right: 10px;
  top: 10px;
  background: #1e293b;
  color: #38bdf8;
  border: 1px solid #334155;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.btn-paste:active {
  background: #334155;
}
.btn-primary {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(135deg, #6366f1, #4f46e5);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
  transition: opacity 0.2s;
}
.btn-primary:active {
  opacity: 0.85;
}
#result {
  margin-top: 12px;
  font-size: 13px;
  color: #fbbf24;
  text-align: center;
  word-break: break-word;
}
/* Khu vực kết quả hiển thị thông tin video */
.video-info {
  display: none;
  margin-top: 16px;
  background: #090d16;
  border-radius: 14px;
  padding: 14px;
  border: 1px solid #1e293b;
}
.video-info img {
  width: 100%;
  border-radius: 10px;
  max-height: 220px;
  object-fit: cover;
  margin-bottom: 10px;
}
.video-title {
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
  max-height: 50px;
  overflow: hidden;
  line-height: 1.4;
}
.download-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.btn-option {
  display: block;
  width: 100%;
  text-align: center;
  background: #db2777;
  color: white;
  padding: 11px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
  font-size: 13px;
  box-shadow: 0 2px 8px rgba(219, 39, 119, 0.3);
}
.btn-option.mp3 {
  background: #7c3aed;
  box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
}
.btn-option.cover {
  background: #0284c7;
  box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
}
.btn-option:active {
  opacity: 0.85;
}
.note {
  color: #64748b;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 14px;
  text-align: center;
}
footer {
  text-align: center;
  color: #475569;
  font-size: 12px;
  margin-top: 15px;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>CHINH VIDEO</h1>
    <p class="subtitle">Trình tải xuống Douyin & Kuaishou chuyên nghiệp</p>
  </header>

  <div class="card">
    <div class="input-header">
      <span id="charCounter">Bạn có thể nhập liên kết (0/500)</span>
      <button class="btn-clear" onclick="clearText()">Xóa văn bản</button>
    </div>

    <div class="input-group">
      <textarea id="link" placeholder="Dán liên kết tại đây..." oninput="updateCount()"></textarea>
      <button class="btn-paste" onclick="pasteLink()">Dán</button>
    </div>
    
    <button class="btn-primary" onclick="analyze()">Phân tích liên kết</button>
    <p id="result" role="status" aria-live="polite"></p>

    <!-- Khu vực hiển thị thông tin video -->
    <div id="videoInfoBox" class="video-info">
      <img id="thumb" src="" alt="Ảnh bìa video">
      <div id="vTitle" class="video-title"></div>
      
      <div class="download-options">
        <a id="btnHD" href="#" class="btn-option" target="_blank" download>Tải về [Video Không Logo HD]</a>
        <a id="btnAudio" href="#" class="btn-option mp3" target="_blank" download>Tải về [♫ Âm thanh MP3]</a>
        <a id="btnCover" href="#" class="btn-option cover" target="_blank" download>Tải về [Ảnh bìa video]</a>
      </div>
    </div>

    <p class="note">
      Hỗ trợ tải video Douyin và Kuaishou miễn phí, nhanh chóng.
    </p>
  </div>

  <footer>Chinh Video Downloader · Phiên bản giao diện chuẩn</footer>
</div>

<script>
// Cập nhật bộ đếm ký tự
function updateCount() {
  const text = document.getElementById("link").value;
  const count = text.length;
  document.getElementById("charCounter").textContent = `Bạn có thể nhập liên kết (${count}/500)`;
}

// Nút dán nhanh từ clipboard
async function pasteLink() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById("link").value = text;
    updateCount();
  } catch (err) {
    alert("Không thể dán tự động. Bạn hãy giữ tay vào ô nhập và chọn Dán nhé!");
  }
}

// Nút xóa nhanh toàn bộ nội dung
function clearText() {
  document.getElementById("link").value = "";
  document.getElementById("videoInfoBox").style.display = "none";
  document.getElementById("result").textContent = "";
  updateCount();
}

// Hàm giả lập giao diện phân tích (để kiểm tra hiển thị mượt mà)
function analyze() {
  const rawText = document.getElementById("link").value.trim();
  const result = document.getElementById("result");
  const infoBox = document.getElementById("videoInfoBox");

  infoBox.style.display = "none";

  if (!rawText) {
    result.textContent = "Bạn hãy dán liên kết video trước nhé!";
    return;
  }

  result.textContent = "Đang kiểm tra giao diện hiển thị mẫu...";
  
  // Hiển thị khung mẫu để bạn kiểm tra độ đẹp của giao diện
  setTimeout(() => {
    document.getElementById("thumb").src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60";
    document.getElementById("vTitle").textContent = "Mẫu tiêu đề video minh họa giao diện chuyên nghiệp của Chinh Video Downloader.";
    result.textContent = "Giao diện hiển thị thành công!";
    infoBox.style.display = "block";
  }, 500);
}
</script>
</body>
</html>
