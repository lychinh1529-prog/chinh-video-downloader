<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinh Video Downloader</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #090d16; color: #f1f5f9; }
.container { max-width: 480px; margin: 10px auto; }
header { text-align: center; margin-bottom: 20px; }
h1 { font-size: 26px; font-weight: 800; margin: 0 0 4px 0; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { color: #94a3b8; font-size: 13px; margin: 0; }
.card { background: #131c2e; padding: 18px; border-radius: 20px; border: 1px solid #1e293b; box-shadow: 0 8px 24px rgba(0,0,0,0.4); margin-bottom: 20px; }
.input-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: #94a3b8; }
.btn-clear { background: none; border: none; color: #f87171; font-size: 12px; cursor: pointer; padding: 0; font-weight: 600; }
.input-group { position: relative; }
textarea { width: 100%; height: 95px; border-radius: 14px; padding: 12px; padding-right: 65px; border: 1px solid #334155; background: #090d16; color: white; font-size: 14px; resize: none; outline: none; }
textarea:focus { border-color: #38bdf8; }
.btn-paste { position: absolute; right: 10px; top: 10px; background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-primary { width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; font-size: 15px; font-weight: bold; cursor: pointer; }
#result { margin-top: 12px; font-size: 13px; color: #fbbf24; text-align: center; word-break: break-word; }

.video-info { display: none; margin-top: 16px; background: #090d16; border-radius: 14px; padding: 14px; border: 1px solid #1e293b; }
.video-player-container { width: 100%; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 12px; display: flex; justify-content: center; align-items: center; max-height: 380px; }
video { width: 100%; max-height: 380px; object-fit: contain; outline: none; }
.profile-box { display: flex; align-items: center; gap: 10px; background: #131c2e; padding: 10px; border-radius: 10px; margin-bottom: 12px; }
.profile-box img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.profile-name { font-size: 13px; font-weight: bold; color: #f8fafc; }
.download-options { display: flex; flex-direction: column; gap: 8px; }
.btn-option { display: block; width: 100%; text-align: center; color: white; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 13px; }
.btn-hd { background: #db2777; }
.btn-sd { background: #ea580c; }
.btn-mp3 { background: #7c3aed; }
.btn-cover { background: #0284c7; }
.note { color: #64748b; font-size: 12px; text-align: center; margin-top: 14px; }
footer { text-align: center; color: #475569; font-size: 12px; margin-top: 15px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>CHINH VIDEO</h1>
    <p class="subtitle">Trình tải xuống Douyin & Kuaishou</p>
  </header>

  <div class="card">
    <div class="input-header">
      <span id="charCounter">Liên kết (0/500)</span>
      <button class="btn-clear" onclick="clearText()">Xóa văn bản</button>
    </div>

    <div class="input-group">
      <textarea id="link" maxlength="500" placeholder="Dán liên kết tại đây..." oninput="updateCount()"></textarea>
      <button class="btn-paste" onclick="pasteLink()">Dán</button>
    </div>
    
    <button class="btn-primary" onclick="analyze()">Phân tích liên kết</button>
    <p id="result" role="status" aria-live="polite"></p>

    <div id="videoInfoBox" class="video-info">
      <div class="video-player-container">
        <video id="videoPlayer" controls playsinline></video>
      </div>
      <div class="profile-box">
        <img id="authorAvatar" src="" alt="Avatar">
        <div>
          <div id="authorName" class="profile-name">Tác giả</div>
          <div id="vTitle" style="font-size: 11px; color: #94a3b8; max-height: 35px; overflow: hidden;"></div>
        </div>
      </div>
      <div class="download-options">
        <a id="btnHD" href="#" class="btn-option btn-hd" target="_blank" download>1. Tải xuống [HD Không logo]</a>
        <a id="btnSD" href="#" class="btn-option btn-sd" target="_blank" download>2. Tải xuống [SD]</a>
        <a id="btnAudio" href="#" class="btn-option btn-mp3" target="_blank" download>3. Tải âm thanh [MP3]</a>
        <a id="btnCover" href="#" class="btn-option btn-cover" target="_blank" download>4. Tải ảnh bìa</a>
      </div>
    </div>
  </div>
  <footer>Chinh Video Downloader</footer>
</div>

<script>
function updateCount() {
  const text = document.getElementById("link").value;
  document.getElementById("charCounter").textContent = `Liên kết (${text.length}/500)`;
}

async function pasteLink() {
  try {
    let text = await navigator.clipboard.readText();
    if (text.length > 500) text = text.substring(0, 500);
    document.getElementById("link").value = text;
    updateCount();
  } catch (err) {
    alert("Hãy giữ tay vào ô nhập và chọn Dán nhé!");
  }
}

function clearText() {
  document.getElementById("link").value = "";
  document.getElementById("videoInfoBox").style.display = "none";
  document.getElementById("result").textContent = "";
  document.getElementById("videoPlayer").pause();
  updateCount();
}

async function analyze() {
  const rawText = document.getElementById("link").value.trim();
  const result = document.getElementById("result");
  const infoBox = document.getElementById("videoInfoBox");

  infoBox.style.display = "none";

  if (!rawText) {
    result.textContent = "Bạn hãy dán liên kết video trước nhé!";
    return;
  }

  const urlMatches = rawText.match(/https?:\/\/[^\s]+/g);
  if (!urlMatches) {
    result.textContent = "Không tìm thấy URL hợp lệ trong nội dung.";
    return;
  }

  try {
    result.textContent = "Đang kết nối máy chủ xử lý...";
    const response = await fetch(`/api/download?url=${encodeURIComponent(urlMatches[0])}`);
    const data = await response.json();

    if (data && data.code === 0 && data.data) {
      const v = data.data;
      const videoSrc = v.hdplay || v.play;

      if (!videoSrc) {
        result.textContent = "Lỗi: Máy chủ không tìm thấy đường dẫn tệp video.";
        return;
      }

      document.getElementById("videoPlayer").src = videoSrc;
      document.getElementById("authorAvatar").src = v.author?.avatar || "";
      document.getElementById("authorName").textContent = v.author?.nickname || "Tác giả Douyin";
      document.getElementById("vTitle").textContent = v.title || "";
      
      document.getElementById("btnHD").href = videoSrc;
      document.getElementById("btnSD</h4>").href = v.play || videoSrc;
      document.getElementById("btnAudio").href = v.music || "#";
      document.getElementById("btnCover").href = v.cover || "#";

      result.textContent = "Thành công! Đã lấy video không logo.";
      infoBox.style.display = "block";
    } else {
      result.textContent = data.msg || "Không thể lấy thông tin video từ liên kết này.";
    }
  } catch (err) {
    result.textContent = "Lỗi kết nối máy chủ: " + err.message;
  }
}
</script>
</body>
</html>
