<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinh TikTok Downloader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 28px;
      border: 1px solid #334155;
      border-radius: 18px;
      background: #1e293b;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .subtitle {
      color: #cbd5e1;
      text-align: center;
      margin-bottom: 26px;
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 14px;
      resize: vertical;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #fe2c55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .hint {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      margin-top: 20px;
    }

    footer {
      margin-top: 24px;
      color: #94a3b8;
      text-align: center;
      font-size: 12px;
    }

    a {
      color: #7dd3fc;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Chinh TikTok Downloader</h1>

    <p class="subtitle">
      Công cụ nhận dạng liên kết video TikTok
    </p>

    <textarea
      id="videoUrl"
      placeholder="Dán liên kết video TikTok vào đây..."
    ></textarea>

    <button id="checkButton" onclick="analyzeLink()">
      Phân tích liên kết
    </button>

    <div id="result" role="status" aria-live="polite"></div>

    <p class="hint">
      Hỗ trợ liên kết video TikTok công khai.
      Chức năng lấy video cần API xử lý liên kết.
    </p>

    <footer>
      Chinh TikTok Downloader · Miễn phí
    </footer>
  </main>

  <script>
    const API_BASE = "https://chinh-video-api.onrender.com";

    function isTikTokUrl(value) {
      try {
        const url = new URL(value);
        const host = url.hostname.toLowerCase();

        const allowedHosts = [
          "tiktok.com",
          "www.tiktok.com",
          "m.tiktok.com",
          "vm.tiktok.com",
          "vt.tiktok.com"
        ];

        return (
          (allowedHosts.includes(host) ||
           host.endsWith(".tiktok.com")) &&
          (url.protocol === "https:" || url.protocol === "http:")
        );
      } catch {
        return false;
      }
    }

    async function analyzeLink() {
      const input = document.getElementById("videoUrl");
      const result = document.getElementById("result");
      const button = document.getElementById("checkButton");

      const link = input.value.trim();

      if (!link) {
        result.textContent = "Bạn hãy dán liên kết TikTok trước nhé!";
        return;
      }

      if (!isTikTokUrl(link)) {
        result.textContent =
          "Liên kết chưa đúng. Vui lòng nhập URL video TikTok hợp lệ.";
        return;
      }

      result.textContent = "Đã nhận dạng liên kết TikTok!";
      button.disabled = true;

      try {
        /*
         * Chưa gọi API lấy video vì cần biết chính xác
         * API của bạn yêu cầu endpoint và dữ liệu nào.
         */
        result.innerHTML =
          '✅ Đã nhận dạng link TikTok.<br>' +
          '🔗 <a href="' + link.replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;") +
          '" target="_blank" rel="noopener noreferrer">' +
          'Mở video TikTok</a><br><br>' +
          'API đã được cấu hình tại: ' + API_BASE +
          '<br>Chưa kết nối endpoint lấy video.';

      } catch (error) {
        result.textContent = "Không thể xử lý liên kết lúc này.";
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
